<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteXL Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif,;
    
        }


        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 48px;
            border-bottom: 1px solid lightgray;
        }

        .navbrand {
            font-size: 24px;
            font-weight: 700;
            color: darkgreen ;
            text-decoration: none;
        }

        .navlinks {
            display: flex;
            gap: 32px;
            list-style: none;
            align-items: center;
        }

        .navlinks a {
            text-decoration: none;
            color: black;
            font-size: 15px;
            font-weight: 500;
    
        }

        .navlinks a:hover {
            color: green;
        }

        .signinbtn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            
        }

        .signinbtn:hover {
            background-color: black;
        }
        .subnavbar {
            display: flex;
            gap: 28px;
            list-style: none;
            padding: 12px 48px;
            justify-content: center;
        }



        .subnavbar a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: black;
        }

        .subnavbar a:hover {
            color: green;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="" class="navbrand">ByteXL</a>
            <ul class="navlinks">
                <li><a href="">Courses</a></li>
                <li><a href="">Tutorials</a></li>
                <li><a href="">Practice</a></li>
                <li><a href="">Jobs</a></li>
            </ul>
            <button class="signinbtn">Sign In</button>
        </nav>

  
        <nav>
            <ul class="subnavbar">
                <li><a href="">DSA</a></li>
                <li><a href="">Practice Problems</a></li>
                <li><a href="">C</a></li>
                <li><a href="">C++</a></li>
                <li><a href="">Java</a></li>
                <li><a href="">Python</a></li>
                <li><a href="">JavaScript</a></li>
                <li><a href="">Data Science</a></li>
                <li><a href="">Machine Learning</a></li>
                <li><a href="">Courses</a></li>
                <li><a href="">Linux</a></li>
                <li><a href="">DevOps</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
